# Dependabot keeps dependencies current with weekly pull requests.
# Minor/patch bumps are grouped into a single PR per ecosystem to avoid a flood;
# major bumps stay separate so each one gets its own review (they can carry
# breaking changes — e.g. a framework major that needs code migration).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Gradle dependencies and plugins (build.gradle)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        # jOOQ's codegen crashes on 3.21.x / nu.studer.jooq 10.2.x (confirmed, not yet fixed) — excluded
        # from the group so a broken jOOQ bump can never again get silently bundled with safe updates
        # and fail the whole group's CI. Still surfaces as its own PR to revisit when it's fixed upstream.
        exclude-patterns:
          - "nu.studer.jooq"
          - "org.jooq:*"
        update-types:
          - minor
          - patch

  # GitHub Actions pinned in the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns:
          - "*"
