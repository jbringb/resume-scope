# Dependabot keeps dependencies current with weekly pull requests.
# Minor/patch bumps are grouped into a single PR per ecosystem to avoid a flood;
# major bumps stay separate so each one gets its own review (they can carry
# breaking changes — e.g. a framework major that needs code migration).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Gradle dependencies and plugins (build.gradle)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        # jOOQ gets its own PR: its codegen version must match the jOOQ version Spring Boot manages
        # (spring-boot-dependencies' jooq.version), so it's reviewed alongside Boot bumps, not bundled.
        exclude-patterns:
          - "nu.studer.jooq"
          - "org.jooq:*"
        update-types:
          - minor
          - patch
    # The Gradle Flyway plugin (local `flywayMigrate` only) is pinned to the Flyway version Spring Boot
    # manages at runtime; a major plugin bump ahead of Boot would migrate with a different Flyway.
    ignore:
      - dependency-name: "org.flywaydb*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions pinned in the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns:
          - "*"
