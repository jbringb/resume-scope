name: Deploy · AWS (ECS Express)

# Builds the self-building Dockerfile, pushes to ECR, and deploys via ECS Express Mode.
# The action creates the service on first run and updates it on subsequent runs.
# All AWS infrastructure (roles, ECR, RDS, secret) is provisioned by deploy/aws/infra.yaml.
#
# GitHub Environment "aws" — secrets (3) and variables (4), all from the CloudFormation outputs:
#   secret  AWS_DEPLOY_ROLE_ARN          → output DeployRoleArn
#   secret  ECS_EXECUTION_ROLE_ARN       → output ExecutionRoleArn
#   secret  ECS_INFRASTRUCTURE_ROLE_ARN  → output InfrastructureRoleArn
#   var     AWS_REGION                   → the region you deployed the stack in
#   var     AWS_ACCOUNT_ID               → your 12-digit AWS account ID
#   var     RDS_ENDPOINT                 → output RdsEndpoint

on:
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build · Push · Deploy
    runs-on: ubuntu-latest
    environment: aws
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/resume-scope:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/resume-scope:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS Express
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: resume-scope
          image: ${{ steps.ecr-login.outputs.registry }}/resume-scope:${{ github.sha }}
          execution-role-arn: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
          cluster: default
          container-port: 8086
          health-check-path: /health
          cpu: 1024
          memory: 2048
          min-task-count: 1
          max-task-count: 2
          environment-variables: >-
            [
              {"name":"SPRING_DATASOURCE_URL","value":"jdbc:postgresql://${{ vars.RDS_ENDPOINT }}:5432/resumescope"},
              {"name":"SPRING_DATASOURCE_USERNAME","value":"resumescope"},
              {"name":"SPRING_R2DBC_URL","value":"r2dbc:postgresql://${{ vars.RDS_ENDPOINT }}:5432/resumescope"},
              {"name":"SPRING_R2DBC_USERNAME","value":"resumescope"},
              {"name":"DEPLOYMENT_ENV","value":"production"},
              {"name":"PORT","value":"8086"}
            ]
          secrets: >-
            [
              {"name":"OPENAI_API_KEY","valueFrom":"arn:aws:ssm:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:parameter/resume-scope/openai_api_key"},
              {"name":"SPRING_DATASOURCE_PASSWORD","valueFrom":"arn:aws:ssm:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:parameter/resume-scope/db_password"},
              {"name":"SPRING_R2DBC_PASSWORD","valueFrom":"arn:aws:ssm:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:parameter/resume-scope/db_password"},
              {"name":"API_KEY","valueFrom":"arn:aws:ssm:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:parameter/resume-scope/api_key"}
            ]
