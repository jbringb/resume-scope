name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan (Mondays 06:00 UTC) to catch newly-disclosed patterns.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # security-and-quality covers the default security queries plus
          # maintainability checks. Free for public repositories.
          queries: security-and-quality
          # Excludes generated jOOQ code (build/) from results.
          config-file: ./.github/codeql/codeql-config.yml

      # Build the project so CodeQL can analyze compiled Java.
      - name: Build
        run: ./gradlew build -x test -x spotlessCheck --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
