name: Deploy · Render

# Render builds the self-building Dockerfile itself; this workflow is the single
# deploy trigger (render.yaml sets autoDeploy: false). It fires Render's deploy
# hook and — if API credentials are provided — waits for the deploy to go live.
#
# Required GitHub secret:
#   RENDER_DEPLOY_HOOK_URL  - the service's Deploy Hook URL (Render dashboard)
# Optional secrets (enable the wait-for-live step with real pass/fail feedback):
#   RENDER_API_KEY          - a Render API key
#   RENDER_SERVICE_ID       - the web service id (srv-...)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    environment: render
    steps:
      - name: Trigger deploy hook
        id: trigger
        run: |
          resp=$(curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "$resp"
          deploy_id=$(echo "$resp" | jq -r '.deploy.id // .id // empty')
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to go live
        if: steps.trigger.outputs.deploy_id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$SERVICE_ID" ]; then
            echo "RENDER_API_KEY / RENDER_SERVICE_ID not set — skipping wait."
            echo "Deploy $DEPLOY_ID triggered; track it in the Render dashboard."
            exit 0
          fi
          echo "Polling deploy $DEPLOY_ID ..."
          for i in $(seq 1 60); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')
            echo "  [$i] status=$status"
            case "$status" in
              live) echo "Deploy is live ✅"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deploy failed: $status ❌"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deploy to go live ❌"; exit 1
