name: Deploy · Render

# Render builds the self-building Dockerfile itself; this workflow triggers a
# deploy via Render's deploy hook (render.yaml sets autoDeploy: false). If API
# credentials are provided it then waits for the deploy to go live.
#
# Required GitHub secret:
#   RENDER_DEPLOY_HOOK_URL  - the service's Deploy Hook URL (Render dashboard)
# Optional secrets (enable the wait-for-live step with real pass/fail feedback):
#   RENDER_API_KEY          - a Render API key
#   RENDER_SERVICE_ID       - the web service id (srv-...)

on:
  workflow_dispatch:

concurrency:
  group: deploy-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    environment: render
    steps:
      - name: Trigger deploy hook
        run: |
          # The deploy hook returns 202/"Accepted" with an unstructured body —
          # don't parse it; a successful POST means the deploy was queued.
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" >/dev/null
          echo "Render deploy triggered."

      - name: Wait for deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$SERVICE_ID" ]; then
            echo "RENDER_API_KEY / RENDER_SERVICE_ID not set — skipping wait."
            echo "Track the deploy in the Render dashboard."
            exit 0
          fi
          # Give Render a moment to register the new deploy, then take the latest.
          sleep 5
          deploy_id=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=1" \
            | jq -r '.[0].deploy.id')
          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "Could not determine deploy id from the Render API ❌"; exit 1
          fi
          echo "Polling deploy $deploy_id ..."
          for i in $(seq 1 60); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$deploy_id" \
              | jq -r '.status')
            echo "  [$i] status=$status"
            case "$status" in
              live) echo "Deploy is live ✅"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deploy failed: $status ❌"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deploy to go live ❌"; exit 1
