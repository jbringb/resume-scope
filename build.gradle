buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.flywaydb:flyway-database-postgresql:11.14.1'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'nu.studer.jooq' version '10.0'
    id 'org.flywaydb.flyway' version '11.14.1'
    id 'com.diffplug.spotless' version '8.4.0'
}

group = 'dev.jbringb'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0-M3"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.apache.pdfbox:pdfbox:3.0.7'
    // JDBC driver: Flyway migrations at runtime only (jOOQ codegen reads the migration SQL directly).
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'
    jooqGenerator 'org.jooq:jooq-meta-extensions:3.19.30'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def dbUrl = findProperty('db.url') ?: System.getenv('DB_URL') ?: 'jdbc:postgresql://localhost:5432/resumescope'
def dbUser = findProperty('db.user') ?: System.getenv('DB_USER') ?: 'resumescope'
def dbPassword = findProperty('db.password') ?: System.getenv('DB_PASSWORD') ?: 'resumescope'

flyway {
    url      = dbUrl
    user     = dbUser
    password = dbPassword
    locations = ['filesystem:src/main/resources/db/migration']
}

jooq {
    version = '3.19.30'
    configurations {
        main {
            // Codegen reads the Flyway migration SQL directly (DDLDatabase) instead of connecting to a
            // live Postgres, so it's hermetic and safe to run on every compile: no DB needed, and output
            // goes under build/ (never committed) instead of src/main/java, so a codegen re-run can never
            // touch hand-written sources.
            generateSchemaSourceOnCompilation = true

            generationTool {
                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'
                    database {
                        name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                        properties {
                            property {
                                key   = 'scripts'
                                value = 'src/main/resources/db/migration/*.sql'
                            }
                            property {
                                key   = 'sort'
                                value = 'flyway'
                            }
                            property {
                                key   = 'unqualifiedSchema'
                                value = 'none'
                            }
                            property {
                                key   = 'defaultNameCase'
                                value = 'lower'
                            }
                        }
                        inputSchema = 'PUBLIC'
                        excludes    = 'flyway_schema_history'
                        // DDLDatabase's parser maps JSONB columns to the generic JSON type by default
                        // (unlike a live-Postgres connection, which resolves JSONB correctly) — force it.
                        forcedTypes {
                            forcedType {
                                name         = 'JSONB'
                                includeTypes = 'JSON'
                            }
                        }
                    }
                    generate {
                        deprecationOnUnknownTypes = false
                        javaTimeTypes  = true
                        records        = true
                        fluentSetters  = true
                        daos           = false
                        pojos          = false
                    }
                    target {
                        packageName = 'dev.jbringb.resume_scope.db.generated'
                        directory   = "${layout.buildDirectory.get()}/generated-jooq"
                    }
                }
            }
        }
    }
}

bootJar {
    archiveFileName = 'resume-scope.jar'
    layered {
        enabled = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        palantirJavaFormat('2.71.0')
        target 'src/**/*.java'
    }
}

tasks.named('check') {
    dependsOn 'spotlessCheck'
}
