scrape_configs:
  - job_name: resumescope
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      # host.docker.internal resolves to the host from inside the Prometheus container
      # (docker.internal on Linux needs --add-host=host.docker.internal:host-gateway).
      - targets: ["host.docker.internal:8086"]
