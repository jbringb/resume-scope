spring:
  application:
    name: resume-scope

  # R2DBC — used by jOOQ at runtime for non-blocking queries (see PersistenceConfiguration).
  # With R2DBC present Spring Boot does not auto-configure a JDBC DataSource, so Flyway is
  # given its own JDBC connection below (it has no R2DBC support).
  r2dbc:
    url:      ${SPRING_R2DBC_URL:r2dbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:resumescope}}
    username: ${SPRING_R2DBC_USERNAME:${PGUSER:resumescope}}
    password: ${SPRING_R2DBC_PASSWORD:${PGPASSWORD:resumescope}}

  jooq:
    sql-dialect: postgres

  flyway:
    enabled:   true
    locations: classpath:db/migration
    url:       ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:resumescope}}
    user:      ${SPRING_DATASOURCE_USERNAME:${PGUSER:resumescope}}
    password:  ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:resumescope}}

  ai:
    openai:
      api-key:  ${OPENAI_API_KEY:change-me}
      # Defaults to OpenAI; override base-url + model to use any OpenAI-compatible
      # provider (e.g. Groq, OpenRouter, a local vLLM). base-url is the host only —
      # Spring AI appends /v1/chat/completions, so do not include /v1.
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model:       ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.0

  codec:
    max-in-memory-size: 50MB

  # Applies to the auto-configured RestClient that Spring AI uses for OpenAI calls,
  # so a hung/slow LLM request fails fast instead of blocking the analysis worker.
  http:
    client:
      connect-timeout: 10s
      read-timeout: 60s

server:
  port: ${PORT:8086}

security:
  # Shared API key required on /api/** (sent as the X-API-Key header).
  # Empty = auth disabled (local/dev). Set API_KEY in deployed environments.
  api-key: ${API_KEY:}

analysis:
  # A run is considered expired this many minutes after it is triggered; an expired
  # PENDING/RUNNING run is failed lazily on access and its idempotency key starts a new run.
  run-timeout-minutes: ${ANALYSIS_RUN_TIMEOUT_MINUTES:10}

logging:
  charset:
    console: UTF-8
  level:
    root: INFO
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:}
        environment: ${DEPLOYMENT_ENV:}
