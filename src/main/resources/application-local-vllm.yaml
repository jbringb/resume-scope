spring:
  ai:
    openai:
      # Since Spring AI 2.0 (official openai-java SDK), base-url must include /v1 yourself
      # — the SDK no longer appends it. vLLM serves its OpenAI-compatible API under /v1.
      base-url: ${OPENAI_BASE_URL:http://localhost:8000/v1}
      api-key: ${OPENAI_API_KEY:local-dummy}
      chat:
        model: ${OPENAI_MODEL:Qwen/Qwen3-4B-Instruct-2507}
        temperature: 0.0
